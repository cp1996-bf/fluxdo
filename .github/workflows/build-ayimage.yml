name: Build Android APK (ayimage fix)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android/sdk/ndk \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.3.13750724'

      - name: Setup Android build environment
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk
          sudo apt-get update
          sudo apt-get install -y cmake
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Build ARM64 APK
        run: |
          dart tool/flutterw.dart build apk \
            --release \
            --target-platform android-arm64 \
            --dart-define=cronetHttpNoPlay=true \
            --split-debug-info=build/symbols
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep 'lib/arm64-v8a/libdoh_proxy.so'
          cmp -s core/doh_proxy/certs/ca.der android/app/src/main/res/raw/proxy_ca.der
          cmp -s core/doh_proxy/certs/ca.crt assets/certs/proxy_ca.pem

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fluxdo-ayimage-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
